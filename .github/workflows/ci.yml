name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - uses: astral-sh/setup-uv@v6
      - run: pnpm test
      - name: Generated contracts are current
        run: |
          pnpm --filter @dsh-brain-core/sdk generate
          git diff --exit-code packages/sdk/generated
      - name: E1 file access audit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          bash spikes/s1/e1-strace.sh
